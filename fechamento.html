<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' fonts.googleapis.com; font-src fonts.gstatic.com; connect-src *.supabase.co; img-src 'self' data:;">
<title>SPACEHUB — Fechamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="topbar">
  <div class="brand">SPACEHUB <small>Fechamento de Comissões</small></div>
  <div class="nav-links" id="topbar-nav"></div>
</div>

<div class="container" style="max-width:1000px;">

<!-- Vendedores -->
<div class="admin-section">
  <h2>Vendedores</h2>
  <div class="add-row">
    <select id="sellerAccount" onchange="onSellerAccountChange()">
      <option value="">Selecione a conta</option>
    </select>
    <input type="text" id="sellerName" placeholder="Nome do vendedor">
    <input type="number" id="sellerPct" placeholder="Comissão %" min="0" max="100" step="0.1" style="max-width:120px;">
    <button class="btn-sm" onclick="addSeller()">Adicionar</button>
  </div>
  <div class="msg" id="sellerMsg" style="margin-bottom:12px;"></div>
  <div class="tbl">
    <table>
      <thead><tr><th>Vendedor</th><th>Conta</th><th>Comissão %</th><th>Criado em</th><th></th></tr></thead>
      <tbody id="tSellers"></tbody>
    </table>
  </div>
</div>

<!-- Fechamento -->
<div class="admin-section">
  <h2>Calcular Fechamento</h2>
  <div class="add-row" style="flex-wrap:wrap;">
    <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:150px;">
      <label for="fechAccount" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Conta</label>
      <select id="fechAccount" onchange="onFechAccountChange()">
        <option value="">Selecione</option>
      </select>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;flex:1;min-width:150px;">
      <label for="fechSeller" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Vendedor</label>
      <select id="fechSeller">
        <option value="">Selecione</option>
      </select>
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;">
      <label for="fechStart" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Data inicial</label>
      <input type="date" id="fechStart" style="width:150px;color-scheme:dark;">
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;">
      <label for="fechEnd" style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">Data final</label>
      <input type="date" id="fechEnd" style="width:150px;color-scheme:dark;">
    </div>
    <div style="display:flex;flex-direction:column;gap:2px;justify-content:flex-end;">
      <label style="font-size:10px;color:transparent;">&nbsp;</label>
      <button class="btn-sm" style="white-space:nowrap;padding:8px 14px;font-size:11px;" onclick="loadLives()">Buscar Lives</button>
    </div>
  </div>
  <div class="msg" id="fechMsg" style="margin-bottom:12px;"></div>
</div>

<!-- Lives encontradas -->
<div class="admin-section" id="livesSection" style="display:none;">
  <h2>Lives no Período</h2>
  <p style="font-size:11px;color:var(--muted);margin-bottom:12px;">Marque as lives que pertencem a este vendedor.</p>
  <div style="margin-bottom:12px;">
    <label style="font-size:12px;color:var(--muted);cursor:pointer;">
      <input type="checkbox" id="checkAll" onchange="toggleAll()" style="margin-right:6px;">Selecionar todas
    </label>
  </div>
  <div id="livesList"></div>
  <div style="margin-top:16px;">
    <button class="btn-sm" onclick="calcularFechamento()">Calcular Fechamento</button>
  </div>
</div>

<!-- Resultado -->
<div class="admin-section" id="resultSection" style="display:none;">
  <h2>Resultado do Fechamento</h2>
  <div id="resultSummary"></div>

  <div class="card" style="margin-top:16px;">
    <h3>Comissão a Pagar</h3>
    <div id="comissaoResult"></div>
  </div>

  <div class="g3" style="margin-top:16px;">
    <div class="card">
      <h3>Pedidos Liquidados</h3>
      <canvas id="chartLiquidados"></canvas>
    </div>
    <div class="card">
      <h3>Cancelamentos</h3>
      <canvas id="chartCancelamentos"></canvas>
    </div>
    <div class="card">
      <h3>Devoluções</h3>
      <canvas id="chartDevolucoes"></canvas>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h3>Resumo Detalhado</h3>
    <div id="statusBreakdown"></div>
  </div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/auth.js"></script>
<script src="js/fechamento.js"></script>
<script>
(async () => {
  const session = await requireAuth();
  if (!session) return;
  const role = await getUserRole();
  if (role?.role !== 'admin') {
    window.location.href = 'dashboard.html';
    return;
  }
  await renderNav('fechamento');
  await initFechamento();
})();
</script>
</body>
</html>
